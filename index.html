<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <meta name="description" content="کتابخانه جامع و متن‌باز لوگوهای ایرانی با فرمت SVG و PNG">
    <meta property="og:title" content="Logo SVG - Iranian logo library">
    <meta property="og:description" content="دانلود با کیفیت‌ترین لوگوهای برندهای ایرانی">
    <meta property="og:image" content="https://raw.githubusercontent.com/armvnhs/LogoSVG/main/file/favicon.png">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/armvnhs/LogoSVG/main/file/favicon.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/armvnhs/LogoSVG/main/file/favicon.png">

    <title>Logo SVG - Iranian logo library</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        @font-face {
            font-family: 'Estedad';
            src: url('file/Estedad-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --gray-text: #888888;
            --border-color: #e0e0e0;
            --hover-overlay: #1a1a1a;
            --font-primary: 'Estedad', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            direction: rtl;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 40px 40px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .bookmark-hint {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            color: #555;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-family: Arial, sans-serif; 
            direction: ltr; 
            font-weight: 600;
            cursor: help;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .bookmark-hint:hover {
            background-color: #f0f0f0;
            color: #000;
            border-color: #ccc;
        }

        .actions-area {
            display: flex;
            gap: 10px;
        }

        .btn {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-outline {
            border: 1px solid var(--text-color);
            color: var(--text-color);
            background: transparent;
        }

        .btn-dark {
            background-color: #000;
            color: #fff;
            border: 1px solid #000;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-support {
            position: relative;
            overflow: hidden;
            background-color: transparent;
            color: #000;
            border: 1px solid #000;
            transition: color 0.4s ease, border-color 0.4s ease;
        }

        .btn-support::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ab0000, #ff465f);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
            z-index: 0;
        }

        .btn-support:hover {
            border-color: #ca001b;
            color: #fff;
            opacity: 1;
        }

        .btn-support:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-support .material-symbols-outlined,
        .btn-support .btn-text {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .btn-support:hover .material-symbols-outlined {
            animation: heartBeat 0.8s ease-in-out infinite;
            font-variation-settings: 'FILL' 1;
        }

        @keyframes heartBeat {
            0%   { transform: scale(1); }
            25%  { transform: scale(1.3); }
            40%  { transform: scale(1); }
            60%  { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        main {
            max-width: 1000px;
            margin: 60px auto 100px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
        }

        .main-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 60px auto;
        }

        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            font-family: var(--font-primary);
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        #searchInput:focus {
            border-color: #000;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-text);
            pointer-events: none;
        }

        .logos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .logos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .card {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            background: #fff;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card img.logo-img {
            flex: 1;
            width: 65%;
            object-fit: contain;
            margin: 0;
            padding: 10px 0; 
            display: block;
        }

        .card .brand-name {
            color: var(--gray-text);
            font-size: 0.9rem;
            font-weight: 500;
            flex-shrink: 0;
            height: 30px; 
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--hover-overlay);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .download-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 50px;
            font-family: var(--font-primary);
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .download-btn:hover {
            background: #e0e0e0;
        }

        footer {
            background-color: #000;
            color: #fff;
            padding: 20px 40px;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .github-link {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-logo {
            height: 45px;
            width: auto;
            display: block;
        }

        button, .btn {
            font-family: 'Estedad', sans-serif !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: right;
            direction: rtl;
            font-family: 'Estedad', sans-serif;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            font-size: 28px;
            cursor: pointer;
            line-height: 20px;
            color: #666;
        }

        .telegram-submit-box {
            text-align: center;
            padding: 10px 0;
        }

        .telegram-icon-wrapper {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            color: #2AABEE;
        }

        .telegram-large-icon {
            width: 100%;
            height: 100%;
        }

        .telegram-desc {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #2AABEE;
            color: #ffffff !important;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(42, 171, 238, 0.3);
        }

        .btn-telegram:hover {
            background-color: #2298d6;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(42, 171, 238, 0.4);
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 30px;
            }

            .logo-area {
                order: -1; 
                justify-content: center;
                width: 100%;
            }

            .bookmark-hint {
                display: none !important;
            }

            .actions-area {
                order: 1;
                width: 100%;
                justify-content: center;
            }

            .card-overlay {
                flex-direction: column-reverse; 
                gap: 12px;
                padding: 20px;
            }

            .download-btn {
                width: 100%;
                justify-content: center;
                height: 40px;
            }
        }

        .site-toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: 'Estedad', sans-serif;
            font-size: 14px;
            font-weight: 500;
            z-index: 999999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .site-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .site-toast.success {
            background-color: #48bb78;
        }

        .site-toast.error {
            background-color: #f56565;
        }
    </style>
</head>
<body>

    <div id="siteToast" class="site-toast">
        <span id="toastIcon"></span>
        <span id="toastMessage"></span>
    </div>

    <header>
        <div class="header-container">
            <div class="actions-area">
                <a href="https://daramet.com/armvnhs" class="btn btn-support">
                    <span class="material-symbols-outlined">favorite</span>
                    <span class="btn-text">حمایت مالی</span>
                </a>
                <a href="#" class="btn btn-dark" onclick="toggleModal(true); return false;">
                    <span class="material-symbols-outlined">north_east</span>
                    ارسال لوگو
                </a>
            </div>
            <div class="logo-area">
                <!-- کادر راهنمای بوکمارک (چون سایت راست‌چین است، قبل از لوگو قرار می‌گیرد تا سمت راست بیفتد) -->
                <span class="bookmark-hint" title="بوکمارک کردن سایت">Ctrl + D</span>
                <a href="index.html" style="display: flex; align-items: center;">
                    <img src="https://raw.githubusercontent.com/armvnhs/LogoSVG/main/file/LogoSVG.svg" 
                        alt="LogoSVG" 
                        class="site-logo" 
                        style="height: 40px; width: auto;">
                </a>
            </div>
        </div>
    </header>

    <main>
        <h1 class="main-title">کتابخانه لوگوهای ایرانی</h1>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="جستجوی نام برند...">
            <span class="material-symbols-outlined search-icon">search</span>
        </div>

        <div class="logos-grid" id="logosGrid">
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="made-with">
                <span>ساخته شده با ❤️ و کمی ☕</span>
            </div>
            <a href="https://armvnhs.ir" target="_blank" class="github-link" style="text-decoration: none; color: inherit;">
                <span>armvnhs.ir</span>
                <span class="material-symbols-outlined" style="font-size: 20px;">language</span>
            </a>
        </div>
    </footer>

    <!-- مودال ارسال لوگو -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ارسال لوگوی جدید</h3>
                <span class="close-btn" onclick="toggleModal(false)">&times;</span>
            </div>

            <div class="telegram-submit-box">
                <div class="telegram-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="telegram-large-icon">
                        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.32.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 2.37-.96 8.034-1.36 10.626-.16.86-.46 1.309-.76 1.343-.66.076-1.16-.42-1.805-.845-1.007-.665-1.575-1.074-2.55-1.716-1.125-.742-.396-1.15.244-1.805.167-.17 3.076-2.825 3.132-3.064a.208.208 0 0 0-.058-.202.24.24 0 0 0-.238-.033c-.092.03-1.697 1.085-4.795 3.167-.453.31-.86.463-1.22.455-.4-.008-1.17-.225-1.74-.41-.7-.228-1.25-.349-1.204-.738.024-.202.31-.41.85-.624 3.327-1.448 5.545-2.404 6.654-2.868 3.15-1.32 3.805-1.547 4.23-1.554z"/>
                    </svg>
                </div>
                <p class="telegram-desc">لطفاً فایل SVG لوگوی مورد نظرتان را مستقیماً در تلگرام برای ما ارسال کنید تا پس از بررسی به سایت اضافه شود.</p>
                
                <a href="https://t.me/armvnpv" target="_blank" class="btn-telegram">
                    ارسال فایل در تلگرام
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
    
    <script>
        const FOLDER_NAME = "logos";         
        const gridContainer = document.getElementById('logosGrid');
        const searchInput = document.getElementById('searchInput');

        let allLogoFiles = [];

        function showToast(message, type = 'success') {
            const toast = document.getElementById('siteToast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toast.className = 'site-toast'; 
            toast.classList.add(type);
            
            toastMessage.innerText = message;
            toastIcon.innerText = type === 'success' ? '🎉' : '❌';

            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        async function fetchLogos() {
            try {
                const response = await fetch('logos.json');
                if (!response.ok) throw new Error('فایل یافت نشد');
                
                const data = await response.json();
                
                allLogoFiles = data.filter(file => file.endsWith('.svg'));
                renderLogos('');
                
            } catch (error) {
                console.error('Error fetching logos:', error);
                gridContainer.innerHTML = `<p style="text-align:center; width:100%;">خطا در بارگذاری لوگوها. لطفاً فایل logos.json را ایجاد کنید.</p>`;
            }
        }

        function renderLogos(filterText = '') {
            gridContainer.innerHTML = ''; 

            const filteredLogos = allLogoFiles.filter(fileName => {
                const brandName = fileName.replace('.svg', '').replace(/-/g, ' ');
                return brandName.toLowerCase().includes(filterText.toLowerCase());
            });

            if (filteredLogos.length === 0 && allLogoFiles.length > 0) {
                gridContainer.innerHTML = '<p style="text-align:center; width:100%;">لوگویی پیدا نشد.</p>';
                return;
            }

            filteredLogos.forEach(fileName => {
                const brandName = fileName.replace('.svg', '').replace(/-/g, ' ');
                createCard(fileName, brandName);
            });
        }

        function createCard(fileName, brandName) {
            const card = document.createElement('div');
            card.className = 'card';

            const filePath = `${FOLDER_NAME}/${fileName}`;

            card.innerHTML = `
                <img src="${filePath}" alt="${brandName}" class="logo-img" loading="lazy">
                <div class="brand-name">${brandName}</div>
                
                <div class="card-overlay">
                    <a href="${filePath}" download="${fileName}" class="download-btn">
                        <span class="material-symbols-outlined" style="font-size:16px;">download</span> SVG
                    </a>
                    <button class="download-btn" onclick="downloadAsPng('${filePath}', '${fileName}')">
                        <span class="material-symbols-outlined" style="font-size:16px;">image</span> PNG
                    </button>
                </div>
            `;

            gridContainer.appendChild(card);
        }

        function downloadAsPng(svgUrl, fileName) {
            fetch(svgUrl)
                .then(response => response.text())
                .then(svgText => {
                    const img = new Image();
                    const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);

                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const scale = 3; 
                        canvas.width = img.width * scale || 1000;
                        canvas.height = img.height * scale || 1000;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        const pngUrl = canvas.toDataURL('image/png');
                        const downloadLink = document.createElement('a');
                        downloadLink.href = pngUrl;
                        downloadLink.download = fileName.replace('.svg', '.png');
                        document.body.appendChild(downloadLink);
                        downloadLink.click();
                        document.body.removeChild(downloadLink);

                        URL.revokeObjectURL(url);
                    };

                    img.src = url;
                })
                .catch(err => console.error('Error converting SVG to PNG:', err));
        }

        searchInput.addEventListener('input', (e) => {
            renderLogos(e.target.value);
        });

        fetchLogos();

        function toggleModal(shouldShow) {
            const modal = document.getElementById('customModal');
            if (!modal) return;

            if (shouldShow) {
                modal.classList.add('show');
                document.body.style.overflow = 'hidden'; 
            } else {
                modal.classList.remove('show');
                document.body.style.overflow = 'auto'; 
            }
        }

        window.addEventListener('click', function(e) {
            const modal = document.getElementById('customModal');
            if (e.target === modal) {
                toggleModal(false);
            }
        });

        // ====== کد ثبت Service Worker برای فعال شدن PWA ======
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('Service Worker با موفقیت ثبت شد:', registration);
                }).catch(error => {
                    console.log('ثبت Service Worker با خطا مواجه شد:', error);
                });
            });
        }
    </script>    
</body>
</html>
