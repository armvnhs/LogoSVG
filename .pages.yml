media:
  - name: logos
    label: Logo files
    input: logos
    output: /logos
    extensions: [svg]

content:
  - name: brands
    label: Brands
    type: collection
    path: data/brands
    format: json
    subfolders: false
    filename: "{year}{month}{day}-{hour}{minute}{second}.json"
    view:
      fields: [name, en, category]
      primary: name
      search: [name, en, category]
      sort: [name, category]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name (Persian)
        type: string
        required: true
      - name: en
        label: Name (English)
        type: string
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: حمل‌ونقل و سفر
              label: Transport & Travel
            - name: غذا
              label: Food
            - name: خرید و فروش
              label: Shopping
            - name: مخابرات
              label: Telecom
            - name: رسانه و سرگرمی
              label: Media & Entertainment
            - name: فناوری و اپلیکیشن
              label: Tech & Apps
            - name: آموزش
              label: Education
            - name: طراحی و خلاقیت
              label: Design & Creative
      - name: assets
        label: Logo files
        type: object
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{fields.type}"
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options:
              values:
                - name: Icon
                  label: Icon
                - name: Persian
                  label: Persian
                - name: English
                  label: English
                - name: Both
                  label: Persian + English
                - name: Old
                  label: Old version
                - name: Slogan
                  label: With slogan
                - name: Other
                  label: Other
          - name: file
            label: File (SVG)
            type: image
            required: true
            options:
              media: logos
              extensions: [svg]
      - name: colors
        label: Brand colors
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{fields.hex}"
        fields:
          - name: name
            label: Color name
            type: string
          - name: hex
            label: Hex code
            type: string
            required: true
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Use the format #RRGGBB"

settings:
  commit:
    templates:
      create: "Add {filename}"
      update: "Update {filename}"
      delete: "Remove {filename}"
