# تنظیمات پنل مدیریت (Pages CMS) برای LogoSVG
media:
  - name: logos
    label: فایل لوگوها
    input: logos
    output: /logos
    extensions: [svg]

content:
  - name: logos
    label: لوگوها
    type: file
    path: logos-data.json
    format: json
    list: true
    fields:
      - name: file
        label: فایل لوگو (SVG)
        type: image
        required: true
        options:
          media: logos
          extensions: [svg]
      - name: name
        label: نام نمایشی
        type: string
        required: true
        description: همین نام زیر لوگو نشان داده می‌شود. مثال، اسنپ (فارسی)
      - name: en
        label: نام انگلیسی
        type: string
        description: برای جستجوی انگلیسی. مثال، Snapp
      - name: category
        label: دسته
        type: select
        required: true
        options:
          values:
            - حمل‌ونقل و سفر
            - غذا
            - خرید و فروش
            - مخابرات
            - رسانه و سرگرمی
            - فناوری و اپلیکیشن
            - آموزش
            - طراحی و خلاقیت

settings:
  commit:
    templates:
      create: "افزودن {filename}"
      update: "ویرایش {filename}"
      delete: "حذف {filename}"
