name: Auto Update Logos JSON

on:
  push:
    branches:
      - main
    paths:
      - 'logos/**' # این ربات فقط وقتی کار میکنه که تغییری در پوشه لوگوها ایجاد بشه

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate logos.json
        run: |
          # رفتن به پوشه لوگوها
          cd logos || exit
          # پیدا کردن همه فایل‌های svg و تبدیل آن‌ها به فرمت جیسون
          ls *.svg | jq -R -s -c 'split("\n")[:-1]' > ../logos.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logos.json
          # اگر تغییری بود کامیت کن، وگرنه رد شو
          git commit -m "🤖 Auto-updated logos.json" || echo "No changes to commit"
          git push
