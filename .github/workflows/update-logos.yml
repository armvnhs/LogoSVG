name: Auto Update Logos JSON

on:
  push:
    branches:
      - main # یا اگر اسم برنچ اصلی شما master است، آن را تغییر دهید
    paths:
      - 'logos/*.svg' # هر زمان فایلی در این پوشه تغییر کند، اکشن اجرا می‌شود

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate JSON file
        run: |
          # این اسکریپت لیست فایل‌های SVG را می‌خواند و به فرمت JSON تبدیل می‌کند
          cd logos
          echo "[" > ../logos.json
          ls -1 *.svg | awk '{printf "\"%s\",\n", $0}' | sed '$ s/,$//' >> ../logos.json
          echo "]" >> ../logos.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add logos.json
          git commit -m "Auto-update logos.json" || echo "No changes to commit"
          git push
