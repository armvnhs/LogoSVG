name: build-logos

on:
  push:
    branches: [main]
    paths: ['data/logos/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build logos-data.json
        run: |
          node -e "
          const fs = require('fs');
          const dir = 'data/logos';
          const logos = fs.readdirSync(dir)
            .filter(f => f.endsWith('.json'))
            .map(f => JSON.parse(fs.readFileSync(dir + '/' + f, 'utf8')))
            .filter(x => x && x.file)
            .sort((a, b) => String(a.name).localeCompare(String(b.name), 'fa'));
          fs.writeFileSync('logos-data.json', JSON.stringify({ logos }, null, 2));
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update logos-data.json"
            git push
          fi
